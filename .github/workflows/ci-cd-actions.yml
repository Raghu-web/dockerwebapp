name: Java CI/CD Pipeline

#install maven in the self hosted EC2 instance.
on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          
      - name: Cache Maven Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-
            
      - name: Build Application
        run: |
          mvn clean package
          cp -r target Docker-app

      - name: Debug Sonar Variables
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
         echo "SONAR_HOST_URL=$SONAR_HOST_URL"

      - name: SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          mvn verify \
            org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=myapp \
            -Dsonar.host.url=$SONAR_HOST_URL \
            -Dsonar.token=$SONAR_TOKEN  
      - name: Build Database Image
        run: docker build -t dbimage Docker-db
      - name: Build Application Image
        run: docker build -t appimage Docker-app
      - name: Scan Application Image
        run: trivy image appimage
      - name: Scan Database Image
        run: trivy image dbimage

      - name: Deploy Docker images
        run: |
          docker run -d --name devopsdb -p 3306:3306 dbimage
          docker run -d --name appcont -p 8080:8080 --link devopsdb:sqlconn appimage

      
